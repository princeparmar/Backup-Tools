  # Restore All Endpoints (Satellite BFF — token_key auth, aligned with /auto-sync)
  /restore/prepare:
    get:
      tags:
        - Restore
      summary: Pre-flight restore readiness
      description: |
        Checks StorX grant, OAuth write scopes or Gmail DWD impersonation, backup data count,
        and live API probe before POST /restore/all. Satellite proxies this route with token_key.
        On missing OAuth scopes, user reconnects via existing PUT /auto-sync/job (not a new cred API).
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - in: query
          name: project_id
          required: true
          schema:
            type: string
          description: Storj/Satellite project id (same as autosync policy UI)
        - in: query
          name: login_id
          required: true
          schema:
            type: string
          description: Mailbox to restore
        - in: query
          name: service
          required: true
          schema:
            type: string
            enum: [gmail, drive, photos, calendar, contacts]
      responses:
        '200':
          description: Readiness result (ready true or false with reason)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  reason:
                    type: string
                  auth_mode:
                    type: string
                    enum: [oauth, dwd]
                  account_type:
                    type: string
                  service:
                    type: string
                  project_id:
                    type: string
                  login_id:
                    type: string
                  backup_item_count:
                    type: integer
                  missing_permissions:
                    type: array
                    items:
                      type: object
                  delegation_setup:
                    type: object
                    description: client_id + scopes map (gmail, drive, calendar, contacts, photos) for Admin Console DWD
                  required_dwd_scopes:
                    type: array
                    items:
                      type: string
                    description: All restore scope URLs the Workspace admin must authorize together
                  reconnect_hint:
                    type: string
        '401':
          description: Missing or invalid token_key

  /restore/live:
    get:
      tags:
        - Restore
      summary: Get active restore jobs
      description: |
        Poll in-progress restore-all jobs for the authenticated user, with progress counters
        and running/retrying batch tasks. Same usage pattern as GET /auto-sync/live.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      responses:
        '200':
          description: List of active restore jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Active Restore Jobs List
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiveRestoreJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /restore/jobs:
    get:
      tags:
        - Restore
      summary: List restore jobs
      description: Recent restore jobs for the user (all statuses). Optional query limit (default 20). No secrets in response.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object

  /restore/all:
    post:
      tags:
        - Restore
      summary: Start restore-all job
      description: |
        Queue an async restore job for one Google service and account.
        Credentials (StorX + Google refresh) are resolved from google_backup_credentials by project_id.
        Re-runs the same checks as GET /restore/prepare. Satellite must send token_key only (no ACCESS_TOKEN headers).
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  type: string
                  enum: [gmail, drive, photos, calendar, contacts]
                  example: gmail
                project_id:
                  type: string
                  description: Storj/Satellite project id
                login_id:
                  type: string
                  example: user@gmail.com
              required:
                - service
                - project_id
                - login_id
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                  status:
                    type: string
                  message:
                    type: string
        '409':
          description: Active restore already in progress for user+service+login_id
        '400':
          description: Invalid request
        '422':
          description: Not ready (same body as GET /restore/prepare when ready is false)
        '401':
          description: Missing or invalid token_key

  /restore/job/{job_id}:
    get:
      tags:
        - Restore
      summary: Get restore job progress
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - in: path
          name: job_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job status and counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                  status:
                    type: string
                  service:
                    type: string
                  login_id:
                    type: string
                  total:
                    type: integer
                  processed:
                    type: integer
                  failed:
                    type: integer
                  cursor_id:
                    type: integer
        '404':
          description: Job not found

  /restore/job/{job_id}/cancel:
    post:
      tags:
        - Restore
      summary: Cancel restore job
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - in: path
          name: job_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job cancelled
        '400':
          description: Job already finished

  /restore/job/{job_id}/dead-items:
    get:
      tags:
        - Restore
      summary: List failed object keys (DLQ)
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - in: path
          name: job_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dead letter items for the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        object_key:
                          type: string
                        reason:
                          type: string
                        error_code:
                          type: string

components:
  parameters:
    tokenKeyHeader:
      name: token_key
      in: header
      required: true
      schema:
        type: string
      description: Satellite session token (_tokenKey). Required for /auto-sync/* policy routes and /restore/* (Satellite BFF).

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    # Common Response Schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          description: Response data

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
        message:
          type: string
          example: "Error description"

    # Auto Sync Schemas
    ActiveJob:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: string
          example: "user123"
        method:
          type: string
          example: "gmail"
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LiveRestoreJob:
      type: object
      properties:
        id:
          type: integer
          example: 42
        service:
          type: string
          example: gmail
        method:
          type: string
          example: gmail
        login_id:
          type: string
          example: user@gmail.com
        status:
          type: string
          enum: [running]
          example: running
        message:
          type: string
        message_status:
          type: string
        total:
          type: integer
        processed:
          type: integer
        failed:
          type: integer
        cursor_id:
          type: integer
        tasks_total:
          type: integer
        tasks_completed:
          type: integer
        tasks_failed:
          type: integer
        progress_percent:
          type: number
          format: float
          example: 24.5
        tasks:
          type: array
          items:
            type: object
            properties:
              start_time:
                type: string
                format: date-time
              status:
                type: string
                enum: [running, retrying]
              batch_index:
                type: integer

    CronJob:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: string
          example: "user123"
        method:
          type: string
          example: "gmail"
        interval:
          type: string
          example: "daily"
        on:
          type: string
          example: "12am"
        policy_id:
          type: integer
          example: 10
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UsersGroupsDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
          example: ["acme.com", "gmail.com"]

    UsersGroupsServiceView:
      type: object
      properties:
        method:
          type: string
          enum: [gmail, google_drive, google_photos, google_contacts, google_calendar]
        active:
          type: boolean

    UsersGroupsEntityView:
      type: object
      properties:
        name:
          type: string
          description: Display name derived from email (local part before @)
        email:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/UsersGroupsServiceView'

    UsersGroupsPaginationView:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
          description: Current page derived from offset and limit
        total_pages:
          type: integer
        total_count:
          type: integer

    UsersGroupsListResponse:
      type: object
      properties:
        policy_link:
          type: string
          example: /auto-sync/policy
          description: Global policy page link; Satellite redirects user here for schedule management
        entities:
          type: array
          items:
            $ref: '#/components/schemas/UsersGroupsEntityView'
        pagination:
          $ref: '#/components/schemas/UsersGroupsPaginationView'

    ServiceJobCountView:
      type: object
      properties:
        method:
          type: string
          enum: [gmail, google_drive, google_photos, google_contacts, google_calendar]
        total_jobs:
          type: integer
        active_jobs:
          type: integer
        deactive_jobs:
          type: integer

    AutosyncServicesResponse:
      type: object
      properties:
        message:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceJobCountView'

    AutosyncJobListResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: array
          items:
            $ref: '#/components/schemas/CronJob'
        failed:
          type: array
          items: {}

    JobCreateRequest:
      type: object
      properties:
        login_id:
          type: string
          example: "user@example.com"
        storx_token:
          type: string
          example: "storx_access_token"
        email_ids:
          type: array
          items:
            type: string
          example: ["email1@example.com", "email2@example.com"]
        refresh_token:
          type: string
          example: "refresh_token"
      required:
        - login_id
        - storx_token
        - email_ids

    JobUpdateRequest:
      type: object
      properties:
        interval:
          type: string
          example: "weekly"
        on:
          type: string
          example: "Monday"
        refresh_token:
          type: string
          example: "refresh_token"
        database_connection:
          $ref: '#/components/schemas/DatabaseConnection'
        storx_token:
          type: string
          example: "storx_access_token"
        active:
          type: boolean
          example: true

    JobActiveUpdateRequest:
      type: object
      properties:
        active:
          type: boolean
          example: true
      required:
        - active

    PolicyUpdateRequest:
      type: object
      properties:
        interval:
          type: string
          example: "daily"
        on:
          type: string
          example: "12am"
        retention_type:
          type: string
          enum: [never, 30_days, 1_year, 7_years]
          example: "1_year"
        apply_all:
          type: boolean
          default: true
          description: When false, selected_job_ids must be set; a new policy row is created for those jobs only.
        selected_job_ids:
          type: array
          items:
            type: integer
          description: Job IDs to rebind when apply_all is false (mailbox selective renew).
      required:
        - interval
        - on

    PolicyMergeExecuteRequest:
      type: object
      required:
        - policy_ids
      properties:
        policy_ids:
          type: array
          minItems: 2
          items:
            type: integer
          description: All policy IDs in one duplicate group (from merge preview).

    PolicyScheduleView:
      type: object
      properties:
        interval:
          type: string
        on:
          type: string
        retention_type:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_expired:
          type: boolean

    PolicyMergeImpactView:
      type: object
      properties:
        policy_kept:
          type: integer
        policies_to_remove:
          type: integer
          description: Preview only — count of duplicate policies to remove.
        policies_removed:
          type: integer
          description: Execute only — count of policies removed.
        jobs_to_rebind:
          type: integer
          description: Preview only — jobs on duplicate policies that will move.
        jobs_rebound:
          type: integer
          description: Execute only — jobs rebound to canonical policy.
        total_jobs_after_merge:
          type: integer

    MergePreviewPolicy:
      type: object
      allOf:
        - $ref: '#/components/schemas/PolicyListItemView'
        - type: object
          properties:
            role:
              type: string
              enum: [canonical, duplicate]

    PolicyMergeJobPreview:
      type: object
      properties:
        job_id:
          type: integer
        email:
          type: string
        method:
          type: string
        policy_id:
          type: integer

    PolicyMergePreviewGroup:
      type: object
      properties:
        schedule:
          $ref: '#/components/schemas/PolicyScheduleView'
        account:
          $ref: '#/components/schemas/ConnectedAccountView'
        impact:

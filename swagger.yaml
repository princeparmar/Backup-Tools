openapi: 3.0.3
info:
  title: Backup Tools API
  description: |
    A comprehensive backup and synchronization API that allows users to backup data from various cloud services 
    (Google Drive, Google Photos, Gmail, Google Cloud Storage, Dropbox, Office 365, AWS S3, GitHub, Shopify, QuickBooks) 
    to a satellite storage system and vice versa.
    
    ## Features
    - **Multi-Platform Support**: Integrate with major cloud providers
    - **Automatic Backup**: Schedule and manage automated backup jobs
    - **Satellite Storage**: Store and retrieve data from satellite storage
    - **Real-time Sync**: Live synchronization capabilities
    - **Authentication**: JWT-based authentication with OAuth2 flows
    
    ## Authentication
    Most endpoints require authentication via JWT token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    Some endpoints also require an ACCESS_TOKEN header for satellite operations:
    ```
    ACCESS_TOKEN: <your-satellite-access-token>
    ```
  version: 1.0.0
  contact:
    name: Backup Tools Support
    email: support@backuptools.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8005
    description: Development server
  - url: https://backup.storx.io
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Auto Sync
    description: Automatic backup and synchronization management
  - name: Google Drive
    description: Google Drive file operations
  - name: Google Photos
    description: Google Photos album and media operations
  - name: Gmail
    description: Gmail message operations
  - name: Google Cloud Storage
    description: Google Cloud Storage bucket and object operations
  - name: Dropbox
    description: Dropbox file operations
  - name: Office 365
    description: Office 365 Outlook message operations
  - name: AWS S3
    description: AWS S3 bucket and object operations
  - name: GitHub
    description: GitHub repository operations
  - name: Shopify
    description: Shopify store data operations
  - name: QuickBooks
    description: QuickBooks business data operations
  - name: Satellite
    description: Satellite storage operations
  - name: Scheduled Tasks
    description: Scheduled task management
  - name: Monitoring
    description: System monitoring and metrics
  - name: Restore
    description: Satellite-proxied restore-all (vault → Google). Requires token_key header; not for direct browser access.

paths:
  # Authentication Endpoints
  /satellite-auth:
    post:
      tags:
        - Authentication
      summary: Authenticate with Satellite
      description: Authenticate user with satellite storage system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Satellite authentication token
              required:
                - token
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /google-auth:
    post:
      tags:
        - Authentication
      summary: Google OAuth Authentication
      description: Authenticate with Google services using OAuth2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: OAuth2 authorization code
                refresh_token:
                  type: string
                  description: OAuth2 refresh token
              required:
                - code
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Authentication
      summary: Google OAuth Authentication (GET)
      description: Alternative Google OAuth authentication endpoint
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Auto Sync Endpoints
  /auto-sync/live:
    get:
      tags:
        - Auto Sync
      summary: Get Active Jobs
      description: Get all active automatic sync jobs for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/users-groups/domains:
    get:
      tags:
        - Auto Sync
      summary: List Connected Domains
      description: |
        Returns unique domain strings from connected credentials for the Users & Groups domain dropdown.
        Scoped to credentials linked to the user's non-placeholder jobs.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      responses:
        '200':
          description: Unique domain strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersGroupsDomainsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/users-groups:
    get:
      tags:
        - Auto Sync
      summary: List Users and Groups (by email)
      description: |
        Flat listing of mailbox emails with per-service active status.
        Includes one global policy_link (GET /auto-sync/policy) for the page policy action.
        Same response shape for personal Gmail and corporate Workspace; use domain to scope rows.
        Data aggregated from cron jobs only (mailboxes with at least one job).
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Filter to jobs under credentials matching this domain (from domains dropdown)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Email search (partial match on job name or input_data.email)
        - name: method
          in: query
          required: false
          schema:
            type: string
            enum: [all, all_services, gmail, google_drive, google_photos, google_contacts, google_calendar]
          description: |
            Service filter (All Services dropdown). Omit, all, or all_services = no filter.
            Otherwise only mailbox rows that have a job for that service; each row still lists all services.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Max entities to return (default 10)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of entities to skip
      responses:
        '200':
          description: Paginated entity list
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersGroupsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/job/services:
    get:
      tags:
        - Auto Sync
      summary: List All Autosync Services
      description: |
        Returns all supported autosync services with per-method job counts (Services Update page).
        Services with no jobs for the user return zero counts. Use filter.method on GET /auto-sync/job for Configure modal job listing.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      responses:
        '200':
          description: Connected services with per-method job counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosyncServicesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/job:
    get:
      tags:
        - Auto Sync
      summary: List All Jobs
      description: |
        Get automatic sync jobs for the authenticated user.
        Optional filter query param (URL-encoded JSON) supports method for service-specific listing,
        e.g. filter={"method":"gmail"} for Configure Gmail modal.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: |
            URL-encoded JSON filter. Fields: name, method, syncType, active, status, messageStatus, interval.
            Example for Gmail only: {"method":"gmail"}
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosyncJobListResponse'
        '400':
          description: Invalid filter parameter
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/job/{job_id}:
    get:
      tags:
        - Auto Sync
      summary: Get Job Details
      description: Get details of a specific automatic sync job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
          description: Job ID
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJob'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Auto Sync
      summary: Update Job Active State
      description: Update active flag for a single job. Schedule changes use PUT /auto-sync/policy/{policy_id}. Credential updates use PUT /auto-sync/job/project.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
          description: Job ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobActiveUpdateRequest'
      responses:
        '200':
          description: Job updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Auto Sync
      summary: Delete Job
      description: Delete an automatic sync job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
          description: Job ID
      responses:
        '200':
          description: Job deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/job/{method}:
    post:
      tags:
        - Auto Sync
      summary: Create Job
      description: Create a new automatic sync job
      security:
        - bearerAuth: []
      parameters:
        - name: method
          in: path
          required: true
          schema:
            type: string
            enum: [gmail, outlook, database]
          description: Job method type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auto-sync/job/interval:
    get:
      tags:
        - Auto Sync
      summary: Get Interval Configuration
      description: Returns all schedule options (3h, 12h, daily, weekly, monthly) and valid on values per interval
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Interval configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Interval Values
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string

  /auto-sync/job/project:
    put:
      tags:
        - Auto Sync
      summary: Update Connected Account (Project)
      description: Update credential tokens, bulk schedule for all linked jobs, or bulk active state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateResponse'

  /auto-sync/policy/by-job/{job_id}:
    get:
      tags:
        - Auto Sync Policy
      summary: Get Policy For Job
      description: Returns the shared policy linked to a job (replaces GET /auto-sync/job/{job_id}/policy).
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/tokenKeyHeader'
      responses:
        '200':
          description: Policy for job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetailResponse'

  /auto-sync/policy/merge/preview:
    get:
      tags:
        - Auto Sync Policy
      summary: Preview Mergeable Duplicate Policies
      description: |
        Read-only preview of all duplicate policy groups for the authenticated user.
        Each group shares the same schedule and credential. Use policy_ids from a group in POST /auto-sync/policy/merge.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      responses:
        '200':
          description: Merge preview (may be empty when no duplicates exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMergePreviewResponse'

  /auto-sync/policy/merge:
    post:
      tags:
        - Auto Sync Policy
      summary: Merge Selected Duplicate Policies
      description: |
        Merges one complete duplicate policy group identified by policy_ids (from GET /auto-sync/policy/merge/preview).
        All policies in the duplicate set must be included. Rebinds jobs to the canonical policy and soft-deletes duplicates.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyMergeExecuteRequest'
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMergeExecuteResponse'
        '400':
          description: Invalid or incomplete policy_ids set
        '404':
          description: Policy not found for user

  /auto-sync/policy:
    get:
      tags:
        - Auto Sync Policy
      summary: List Policies For User
      description: |
        Returns all distinct shared policies for the authenticated user (token_key).
        Optional credential_id or project_id+google_email filters to one connected account.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - name: credential_id
          in: query
          schema:
            type: integer
        - name: project_id
          in: query
          schema:
            type: string
        - name: google_email
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'

  /auto-sync/policy/{policy_id}:
    get:
      tags:
        - Auto Sync Policy
      summary: Get Policy By ID
      description: Policy row plus all linked jobs (mailboxes). Requires token_key header.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - name: policy_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetailResponse'
    put:
      tags:
        - Auto Sync Policy
      summary: Update Policy Schedule And Retention
      description: |
        apply_all=true updates the same policy for all linked jobs.
        apply_all=false creates a new policy row and rebinds only selected_job_ids (selective renew).
        active must be updated via PUT /auto-sync/job/{job_id}.
      parameters:
        - $ref: '#/components/parameters/tokenKeyHeader'
        - name: policy_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyUpdateResponse'

  /auto-sync/task/{job_id}:
    post:
      tags:
        - Auto Sync
      summary: Create Task
      description: Create a new task for a specific job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
          description: Job ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    get:
      tags:
        - Auto Sync
      summary: List Tasks
      description: Get all tasks for a specific job
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
          description: Job ID
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

  /auto-sync/delete-jobs-by-email:
    delete:
      tags:
        - Auto Sync
      summary: Delete Jobs by Email
      description: Admin endpoint to delete jobs by email address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address
              required:
                - email
      responses:
        '200':
          description: Jobs deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Google Drive Endpoints
  /google/drive-to-satellite/{ID}:
    get:
      tags:
        - Google Drive
      summary: Send File to Satellite
      description: Send a specific file from Google Drive to satellite storage
      security:
        - bearerAuth: []
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
          description: Google Drive file ID
      responses:
        '200':
          description: File sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /google/satellite-to-drive/{name}:
    get:
      tags:
        - Google Drive
      summary: Send File from Satellite
      description: Send a file from satellite storage to Google Drive
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: File name in satellite storage
      responses:
        '200':
          description: File sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /google/drive-root-file-names:
    get:
      tags:
        - Google Drive
      summary: List Root Files
      description: List all files in Google Drive root directory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of root files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriveFile'

  /google/drive-get-file-names:
    get:
      tags:
        - Google Drive
      summary: List All Files
      description: List all files in Google Drive (including subdirectories)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriveFile'

  /google/drive-flat-files:
    get:
      tags:
        - Google Drive
      summary: List Flat Non-Folder Files
      description: Flat paginated list of non-folder files across My Drive and Shared Drives. No recursion or path building.
      security:
        - bearerAuth: []
      parameters:
        - name: nextPageToken
          in: query
          required: false
          schema:
            type: string
        - name: page_token
          in: query
          required: false
          deprecated: true
          schema:
            type: string
      responses:
        '200':
          description: Flat non-folder file page
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        mime_type: { type: string }
                        parents:
                          type: array
                          items: { type: string }
                        modified_time: { type: string }
                        size: { type: integer }
                        md5_checksum: { type: string }
                        version: { type: integer }
                        drive_id: { type: string }
                  nextPageToken:
                    type: string
                  next_page_token:
                    type: string
                  page_size:
                    type: integer

  /google/drive-get-file/{ID}:
    get:
      tags:
        - Google Drive
      summary: Get File by ID
      description: Get file details by Google Drive file ID
      security:
        - bearerAuth: []
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
          description: Google Drive file ID
      responses:
        '200':
          description: File details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveFile'

  /google/satellite-drive:
    get:
      tags:
        - Google Drive
      summary: List Satellite Drive Files
      description: List all Google Drive files stored in satellite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of satellite drive files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SatelliteFile'

  /google/satellite-drive-folder/{name}:
    get:
      tags:
        - Google Drive
      summary: List Folder Files in Satellite
      description: List files in a specific folder stored in satellite
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Folder name
      responses:
        '200':
          description: List of folder files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SatelliteFile'

  /google/all-drive-to-satellite:
    get:
      tags:
        - Google Drive
      summary: Sync All Files to Satellite
      description: Sync all Google Drive files to satellite storage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All files synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /google/folder/{name}/list:
    get:
      tags:
        - Google Drive
      summary: List Folder Files
      description: List all files in a specific Google Drive folder
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Folder name
      responses:
        '200':
          description: List of folder files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriveFile'

  /google/folder/{name}/sync:
    post:
      tags:
        - Google Drive
      summary: Sync Folder Files
      description: Sync all files from a Google Drive folder to satellite
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Folder name
      responses:
        '200':
          description: Folder files synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /google/folder/{id}:
    get:
      tags:
        - Google Drive
      summary: List Folder Files by ID
      description: List all files in a Google Drive folder by folder ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Folder ID
      responses:
        '200':
          description: List of folder files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriveFile'

    post:
      tags:
        - Google Drive
      summary: Sync Folder Files by ID
      description: Sync all files from a Google Drive folder to satellite by folder ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Folder ID
      responses:
        '200':
          description: Folder files synced successfully
